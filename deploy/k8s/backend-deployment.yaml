apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-backend
  namespace: aegisquiz-prod
  labels:
    app.kubernetes.io/name: aegis-backend
    app.kubernetes.io/part-of: aegis-os
    tier: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aegis-backend
  template:
    metadata:
      labels:
        app: aegis-backend
        tier: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics/summary"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: api
        image: cuongvba/aegisquiz-api:v9.2-latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: postgres-connection-string
        - name: Redis__ConnectionString
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: redis-connection-string
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2048Mi"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
