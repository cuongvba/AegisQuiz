apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis-ingress
  namespace: aegisquiz-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "aegis-backend-service"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  tls:
  - hosts:
    - exam.aegisquiz.internal
    secretName: aegisquiz-tls-secret
  rules:
  - host: exam.aegisquiz.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aegis-backend-service
            port:
              number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-backend-service
  namespace: aegisquiz-prod
spec:
  type: ClusterIP
  selector:
    app: aegis-backend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
