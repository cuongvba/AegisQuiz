<!doctype html>
<html lang="vi" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Favicon & PWA Manifest ────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aegis Global" />
    <meta name="application-name" content="Aegis Global" />

    <!-- ── SEO ──────────────────────────────────────────────────── -->
    <title>Aegis Global — The Cognitive Intelligence & Verification Standard</title>
    <meta name="description"
          content="Aegis Global: Hạ tầng Nhận thức & Chuẩn mực Kiểm chứng Toàn cầu (Global Cognitive Infrastructure & Verification Standard). Nền tảng khảo thí thích ứng tâm trắc học IRT 3-PL, bóc tách tri thức tự động CIG và đấu trường mô phỏng quy mô lớn." />
    <meta name="keywords"
          content="Aegis Global, AGCI, Cognitive Infrastructure, Verification Standard, IRT 3-PL, ALDS Standard, Enterprise AI, khảo thí nhận thức" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://aegisglobal.io/" />

    <!-- ── OpenGraph ─────────────────────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://aegisglobal.io/" />
    <meta property="og:title"       content="Aegis Global — The Cognitive Intelligence & Verification Standard" />
    <meta property="og:description" content="Hạ tầng Nhận thức & Chuẩn mực Kiểm chứng Toàn cầu cho Giáo dục, Khảo thí & Doanh nghiệp." />
    <meta property="og:image"       content="/og-image.png" />
    <meta property="og:locale"      content="vi_VN" />

    <!-- ── Twitter Card ─────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Aegis Global — The Cognitive Intelligence & Verification Standard" />
    <meta name="twitter:description" content="Hạ tầng Nhận thức & Chuẩn mực Kiểm chứng Toàn cầu cho Giáo dục, Khảo thí & Doanh nghiệp." />
    <meta name="twitter:image"       content="/og-image.png" />

    <!-- ── Performance: Font Preconnect ─────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter font — Primary brand typeface -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" />

    <!-- ── Theme color for mobile browsers ──────────────────────── -->
    <meta name="theme-color" content="#06b6d4" />
    <meta name="color-scheme" content="light" />

    <!-- ── Inline critical: prevent FOUC before providers mount ─── -->
    <script>
      // [i18n FOUC Fix] Áp dụng ngay ngôn ngữ đã lưu (cùng key 'i18nextLng' mà
      // i18next-browser-languagedetector / useLearnerI18n dùng) trước khi React
      // hydrate — tránh việc <html lang="vi"> cố định gây sai lệch với ngôn ngữ
      // thực tế người dùng đã chọn ở lần truy cập trước (ảnh hưởng SEO/AX).
      try {
        var savedLang = localStorage.getItem('i18nextLng');
        if (savedLang === 'en' || savedLang === 'vi') {
          document.documentElement.lang = savedLang;
        }
      } catch (e) {}

      // Apply stored tenant theme instantly to prevent flash
      try {
        var cfg = localStorage.getItem('tenant_config');
        if (cfg) {
          var t = JSON.parse(cfg).theme;
          if (t) {
            var r = document.documentElement;
            if (t.brandPrimary)   r.style.setProperty('--tenant-brand-primary',   t.brandPrimary);
            if (t.brandSecondary) r.style.setProperty('--tenant-brand-secondary', t.brandSecondary);
            if (t.tenantId)       r.setAttribute('data-tenant', t.tenantId);
            if (t.isRTL)          r.dir = 'rtl';
            if (t.locale)         r.lang = t.locale;
          }
        }
      } catch(e) {}
    </script>
  </head>
  <body>
    <!-- ── Skip to main content (Accessibility) ─────────────────── -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:start-4
             focus:z-[9999] focus:px-4 focus:py-2
             focus:bg-white focus:text-cyan-700 focus:font-bold
             focus:rounded-full focus:shadow-lg focus:outline-2"
      style="text-decoration:none"
    >
      Chuyển đến nội dung chính
    </a>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
